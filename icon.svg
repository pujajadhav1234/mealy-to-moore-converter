<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Transition Arrows (Curved) -->
  <path d="M 170 200 C 230 130, 280 130, 340 200" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="345,195 348,212 332,205" fill="#60a5fa"/>

  <path d="M 340 310 C 280 380, 230 380, 170 310" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="167,317 164,300 180,307" fill="#34d399"/>

  <!-- Left Node (Mealy State) -->
  <circle cx="160" cy="256" r="65" fill="url(#nodeGrad1)" filter="url(#glow)"/>
  <circle cx="160" cy="256" r="55" fill="#0f172a" stroke="#60a5fa" stroke-width="4"/>
  <text x="160" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">q₀</text>

  <!-- Right Node (Moore State) -->
  <circle cx="352" cy="256" r="65" fill="url(#nodeGrad2)" filter="url(#glow)"/>
  <circle cx="352" cy="256" r="55" fill="#0f172a" stroke="#34d399" stroke-width="4"/>
  <text x="352" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">q₀</text>
  <text x="352" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#34d399" text-anchor="middle">/ 0</text>

  <!-- Badges / Labels -->
  <text x="256" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#93c5fd" text-anchor="middle" letter-spacing="3">MEALY ➔ MOORE</text>
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" text-anchor="middle">AUTOMATA CONVERTER</text>
</svg>
